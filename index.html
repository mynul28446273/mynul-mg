<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Video Archive</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Widget Config -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }

        .container { max-width: 900px; margin: 0 auto; padding: 15px; }

        /* --- Page Sections --- */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Archive Controls --- */
        .archive-header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-upload-main {
            width: 100%; background: var(--primary); color: #000;
            border: none; padding: 15px; border-radius: 15px;
            font-weight: 800; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Progress Bar */
        #upload-progress-container {
            display: none; margin-top: 15px; background: rgba(0,0,0,0.3);
            border-radius: 10px; height: 30px; position: relative; overflow: hidden;
            border: 1px solid var(--primary);
        }
        #progress-bar {
            height: 100%; width: 0%; background: var(--primary);
            transition: width 0.3s;
        }
        #progress-text {
            position: absolute; width: 100%; text-align: center;
            top: 5px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 0 5px #000;
        }

        /* Search & Sort */
        .filter-row { display: flex; gap: 10px; margin-top: 20px; }
        .search-box { flex: 2; position: relative; }
        .search-box input {
            width: 100%; background: var(--bg-dark); border: 1px solid #334155;
            padding: 12px 12px 12px 40px; border-radius: 12px; color: #fff; outline: none;
        }
        .search-box i { position: absolute; left: 15px; top: 14px; color: var(--text-muted); }
        .sort-select {
            flex: 1; background: var(--bg-dark); color: #fff; border: 1px solid #334155;
            padding: 10px; border-radius: 12px; outline: none;
        }

        /* --- Video Grid --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .video-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        .video-card:hover { border-color: var(--primary); }
        
        .card-thumb {
            width: 100%; aspect-ratio: 16/9; background: #000;
            display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1);
        }
        .card-body { padding: 12px; }
        .v-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        .v-date { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }

        .card-actions {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;
            padding: 10px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .btn-action { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 12px; text-align: center; }
        .bg-cyan { background: var(--primary); color: #000; }
        .bg-blue { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* --- Bottom Nav --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg); display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; }
        .nav-btn i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-btn.active { color: var(--primary); }

        /* Hidden Widget */
        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .video-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div style="font-size: 12px; color: var(--primary); border: 1px solid; padding: 2px 10px; border-radius: 20px; font-weight: 700;">PRO</div>
    </nav>

    <div class="container">
        
        <!-- Section: Home -->
        <div id="home-sec" class="page-section active">
            <div class="archive-header" style="text-align: center; padding: 50px 20px;">
                <i class="fa-solid fa-cloud-bolt" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
                <h2>Welcome, Mynul</h2>
                <p style="color: var(--text-muted);">আপনার ভিডিও হোস্টিং ড্যাশবোর্ডে স্বাগতম।</p>
                <div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                    <div><b id="count-total" style="font-size: 24px; color: var(--primary);">0</b><br><small>Files</small></div>
                    <div style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 20px;"><b style="font-size: 24px; color: var(--success);">$0.00</b><br><small>Income</small></div>
                </div>
            </div>
        </div>

        <!-- Section: Uploads (Archive Page) -->
        <div id="upload-sec" class="page-section">
            <div class="archive-header">
                <button class="btn-upload-main" id="start-upload-btn">
                    <i class="fa-solid fa-circle-plus"></i> Upload New Video
                </button>

                <!-- Custom Progress Bar -->
                <div id="upload-progress-container">
                    <div id="progress-bar"></div>
                    <div id="progress-text">0% Uploading...</div>
                </div>

                <div class="filter-row">
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="vSearch" placeholder="Search videos..." oninput="renderUI()">
                    </div>
                    <select class="sort-select" id="vSort" onchange="renderUI()">
                        <option value="new">Newest</option>
                        <option value="old">Oldest</option>
                    </select>
                </div>
            </div>

            <div class="video-grid" id="videoGrid">
                <!-- Cards will appear here -->
            </div>
        </div>

        <!-- Section: Settings -->
        <div id="settings-sec" class="page-section">
            <div class="archive-header">
                <h3>Settings</h3>
                <p style="font-size: 14px;">Storage: Uploadcare Cloud (4759...)</p>
                <button class="btn-upload-main" style="background: var(--danger); color: #fff;" onclick="clearAllData()">Clear All Data</button>
                <button class="btn-upload-main" style="margin-top:10px;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="tab('home-sec', this)"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-btn" onclick="tab('upload-sec', this)"><i class="fa-solid fa-folder-open"></i>Uploads</button>
        <button class="nav-btn" onclick="tab('settings-sec', this)"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <!-- Hidden Uploadcare Widget -->
    <input type="hidden" id="uc-widget">

    <script>
        // ১. শুরুতে ডাটা ডিলিট করার লজিক ( user requested to clear previous 2 videos once )
        if(!localStorage.getItem('cleaned_v1')) {
            localStorage.removeItem('mynul_videos');
            localStorage.setItem('cleaned_v1', 'true');
        }

        let videos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
        const widget = uploadcare.Widget('#uc-widget');

        // ২. ট্যাব নেভিগেশন
        function tab(id, el) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        // ৩. পারফেক্ট আপলোড লজিক উইথ প্রগ্রেস বার
        document.getElementById('start-upload-btn').addEventListener('click', () => {
            const dialog = uploadcare.openDialog(null, {
                publicKey: '47591ac5fd5756296d19',
                tabs: 'file',
                multiple: false
            });

            dialog.done(function(file) {
                const progContainer = document.getElementById('upload-progress-container');
                const progBar = document.getElementById('progress-bar');
                const progText = document.getElementById('progress-text');

                progContainer.style.display = 'block';

                file.progress(function(info) {
                    let p = Math.round(info.progress * 100);
                    progBar.style.width = p + '%';
                    progText.innerText = p + '% Uploading...';
                });

                file.done(function(info) {
                    const newVid = {
                        id: info.uuid,
                        name: info.name,
                        url: info.cdnUrl,
                        date: new Date().getTime()
                    };
                    videos.unshift(newVid);
                    localStorage.setItem('mynul_videos', JSON.stringify(videos));
                    
                    progContainer.style.display = 'none';
                    progBar.style.width = '0%';
                    renderUI();
                    alert('সফলভাবে আপলোড হয়েছে!');
                });
            });
        });

        // ৪. রেন্ডার গ্রিড (Search & Sort সহ)
        function renderUI() {
            const grid = document.getElementById('videoGrid');
            const searchTerm = document.getElementById('vSearch').value.toLowerCase();
            const sortOrder = document.getElementById('vSort').value;

            // সর্টিং
            if(sortOrder === 'new') videos.sort((a,b) => b.date - a.date);
            else videos.sort((a,b) => a.date - b.date);

            // ফিল্টারিং
            const filtered = videos.filter(v => v.name.toLowerCase().includes(searchTerm));

            grid.innerHTML = '';
            document.getElementById('count-total').innerText = videos.length;

            if(filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted);">No videos found.</div>';
                return;
            }

            filtered.forEach(v => {
                const date = new Date(v.date).toLocaleDateString('bn-BD');
                grid.innerHTML += `
                    <div class="video-card">
                        <div class="card-thumb"><i class="fa-solid fa-play"></i></div>
                        <div class="card-body">
                            <div class="v-title">${v.name}</div>
                            <div class="v-date">${date}</div>
                        </div>
                        <div class="card-actions">
                            <a href="${v.url}" target="_blank" class="btn-action bg-cyan" title="Play"><i class="fa-solid fa-play"></i></a>
                            <button class="btn-action bg-blue" onclick="copyLink('${v.url}')" title="Copy"><i class="fa-solid fa-link"></i></button>
                            <button class="btn-action bg-red" onclick="deleteVideo('${v.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // ৫. ডিলিট ফাংশন
        function deleteVideo(id) {
            if(confirm('ভিডিওটি কি ডিলিট করতে চান?')) {
                videos = videos.filter(v => v.id !== id);
                localStorage.setItem('mynul_videos', JSON.stringify(videos));
                renderUI();
            }
        }

        function clearAllData() {
            if(confirm('আপনার সব আপলোড করা ভিডিওর লিস্ট কি মুছে ফেলতে চান? (সার্ভার থেকে ডিলিট হবে না)')) {
                localStorage.removeItem('mynul_videos');
                videos = [];
                renderUI();
            }
        }

        // ৬. কপি ফাংশন
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => alert('লিঙ্ক কপি হয়েছে!'));
        }

        window.onload = renderUI;
    </script>
</body>
    </html>
