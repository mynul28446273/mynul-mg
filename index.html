<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mynul.mg - Video Archive</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Widget -->
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        /* --- Header Navigation --- */
        .navbar {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; letter-spacing: 1px; }

        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

        /* --- Archive Style Control Bar --- */
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            background: rgba(30, 41, 59, 0.5);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            align-items: center;
        }

        .search-box {
            flex: 2;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid #334155;
            padding: 12px 15px 12px 40px;
            border-radius: 12px;
            color: #fff;
            outline: none;
        }
        .search-box i { position: absolute; left: 15px; top: 14px; color: var(--text-muted); }

        .sort-box { flex: 1; min-width: 150px; }
        .sort-box select {
            width: 100%;
            background: var(--bg-dark);
            color: #fff;
            border: 1px solid #334155;
            padding: 11px;
            border-radius: 12px;
            outline: none;
        }

        .btn-upload-trigger {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .btn-upload-trigger:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4); }

        /* --- Video Grid Layout --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .video-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .thumbnail-area {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .thumbnail-area i { font-size: 40px; color: rgba(255,255,255,0.1); }
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
        }
        .video-card:hover .play-overlay { opacity: 1; }

        .card-body { padding: 15px; flex-grow: 1; }
        .video-name { font-size: 14px; font-weight: 600; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-date { font-size: 11px; color: var(--text-muted); margin-bottom: 15px; }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 0 15px 15px;
        }
        .btn-card {
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn-play { background: var(--primary); color: #000; }
        .btn-copy { background: #334155; color: #fff; }
        .btn-card:active { transform: scale(0.95); }

        /* Hidden Uploadcare Widget */
        .uploadcare--widget { display: none !important; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card-bg);
            display: flex; justify-content: space-around;
            padding: 12px; border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        .nav-item { color: var(--text-muted); text-decoration: none; text-align: center; font-size: 10px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }

        @media (max-width: 600px) {
            .video-grid { grid-template-columns: 1fr; }
            .control-bar { padding: 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div style="font-size: 12px; background: var(--primary); color: #000; padding: 2px 8px; border-radius: 5px; font-weight: 700;">FILES</div>
    </nav>

    <div class="container">
        
        <!-- Control Bar (Internet Archive Style) -->
        <div class="control-bar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="ভিডিওর নাম দিয়ে খুঁজুন..." oninput="filterVideos()">
            </div>
            
            <div class="sort-box">
                <select id="sortSelect" onchange="sortVideos()">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>

            <button class="btn-upload-trigger" onclick="openUploader()">
                <i class="fa-solid fa-cloud-arrow-up"></i> Upload
            </button>
            
            <!-- Hidden Widget -->
            <input type="hidden" role="uploadcare-uploader" 
                   data-public-key="47591ac5fd5756296d19" 
                   data-tabs="file" id="uploader">
        </div>

        <div class="video-grid" id="videoGrid">
            <!-- ভিডিও কার্ডগুলো এখানে লোড হবে -->
        </div>

    </div>

    <!-- Mobile Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fa-solid fa-folder-open"></i>Uploads</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-house"></i>Home</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-gear"></i>Settings</a>
    </div>

    <script>
        const widget = uploadcare.Widget('#uploader');
        const videoGrid = document.getElementById('videoGrid');
        let allVideos = [];

        // ১. ভিডিও আপলোডার ওপেন করা
        function openUploader() {
            document.querySelector('.uploadcare--widget__button_type_open').click();
        }

        // ২. আপলোড শেষ হলে ডাটা সেভ করা
        widget.onUploadComplete(function(info) {
            const videoData = {
                id: info.uuid,
                name: info.name,
                url: info.cdnUrl,
                date: new Date().getTime() // Sorting-এর জন্য টাইমস্ট্যাম্প
            };
            
            saveToStorage(videoData);
            loadVideos();
        });

        function saveToStorage(video) {
            let videos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
            videos.unshift(video);
            localStorage.setItem('mynul_videos', JSON.stringify(videos));
        }

        // ৩. ভিডিও লোড করা (Grid Layout)
        function loadVideos() {
            allVideos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
            renderGrid(allVideos);
        }

        function renderGrid(data) {
            videoGrid.innerHTML = '';
            if(data.length === 0) {
                videoGrid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--text-muted);">কোনো ভিডিও পাওয়া যায়নি।</div>`;
                return;
            }

            data.forEach(vid => {
                const dateStr = new Date(vid.date).toLocaleDateString('bn-BD');
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="thumbnail-area">
                        <i class="fa-solid fa-file-video"></i>
                        <div class="play-overlay">
                            <i class="fa-solid fa-circle-play" style="color:var(--primary); font-size:50px;"></i>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="video-name">${vid.name}</div>
                        <div class="video-date"><i class="fa-regular fa-calendar-days"></i> ${dateStr}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-card btn-copy" onclick="copyLink('${vid.url}')">
                            <i class="fa-solid fa-link"></i> Copy
                        </button>
                        <a href="${vid.url}" target="_blank" class="btn-card btn-play">
                            <i class="fa-solid fa-play"></i> Play
                        </a>
                    </div>
                `;
                videoGrid.appendChild(card);
            });
        }

        // ৪. সার্চ ফাংশন
        function filterVideos() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allVideos.filter(v => v.name.toLowerCase().includes(term));
            renderGrid(filtered);
        }

        // ৫. সর্টিং ফাংশন (Date অনুযায়ী)
        function sortVideos() {
            const val = document.getElementById('sortSelect').value;
            if(val === 'newest') {
                allVideos.sort((a, b) => b.date - a.date);
            } else {
                allVideos.sort((a, b) => a.date - b.date);
            }
            renderGrid(allVideos);
        }

        // ৬. কপি ফাংশন
        function copyLink(url) {
            const el = document.createElement('input');
            el.value = url;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert('লিঙ্ক কপি হয়েছে! এবার আপনার শর্টনারে ব্যবহার করুন।');
        }

        // শুরুতে লোড
        window.onload = loadVideos;
    </script>
</body>
</html>
