    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .active-tag { font-size: 10px; color: var(--primary); border: 1px solid var(--primary); padding: 2px 10px; border-radius: 20px; font-weight: 700; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* Navigation Logic */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Cards */
        .card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* Real Live Tracker Box */
        .live-box {
            margin-bottom: 15px;
            background: rgba(34, 197, 94, 0.1);
            padding: 8px 15px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; margin-right: 8px; position: relative; }
        .dot::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; animation: pPulse 1.5s infinite; }
        @keyframes pPulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        /* Storage Pulse Bar */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .storage-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Buttons */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-bottom: 12px; }
        .btn-blue { background: var(--primary); color: #000; }
        .btn-green { background: var(--success); color: #fff; }

        /* Progress Area */
        #prog-box { display: none; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; height: 40px; position: relative; overflow: hidden; border: 1px solid var(--primary); }
        #prog-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        #prog-text { position: absolute; width: 100%; text-align: center; top: 10px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); }
        .v-body { padding: 12px; }
        .v-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; text-align: center; }
        .bg-cyan { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* Bottom Menu */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; outline: none; }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-tab.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
