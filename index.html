<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Ultra Fast Cloud</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root { --primary: #38bdf8; --bg: #020617; --card: #1e293b; --danger: #ff4757; --success: #2ed573; --trading: #f59e0b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #fff; font-family: 'Poppins', 'Hind Siliguri', sans-serif; margin: 0; padding-bottom: 90px; overflow-x: hidden; }

        /* --- Fixed Navbar --- */
        .navbar { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 9999; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .live-tag { background: rgba(34, 197, 94, 0.1); padding: 5px 12px; border-radius: 20px; color: var(--success); font-size: 12px; font-weight: 800; border: 1px solid rgba(34, 197, 94, 0.3); display: flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; position: relative; }
        .pulse::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; left: 0; animation: pLive 1.5s infinite; }
        @keyframes pLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Sections Control (No Delay) --- */
        .page-section { display: none; }
        .active-section { display: block !important; }

        .card { background: var(--card); padding: 25px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }

        /* --- Signal Display --- */
        .ai-box { background: #000; border-radius: 25px; padding: 20px; border: 2px solid var(--trading); margin-bottom: 15px; }
        .verdict { font-size: 50px; font-weight: 900; margin: 10px 0; }
        .up { color: var(--success); text-shadow: 0 0 15px var(--success); }
        .down { color: var(--danger); text-shadow: 0 0 15px var(--danger); }
        
        .timer-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .timer-fill { height: 100%; width: 100%; background: var(--trading); transition: width 1s linear; }

        /* --- Grid --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 10px; font-size: 11px; font-weight: 600; height: 45px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; }
        .act-btn { border: none; padding: 10px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .bg-blue { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 9999; }
        .nav-item { background: none; border: none; color: #94a3b8; font-size: 10px; cursor: pointer; text-align: center; flex: 1; outline: none; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="javascript:void(0)" class="logo" onclick="location.reload()">mynul.mg</a>
        <div class="live-tag">
            <span class="pulse"></span> Online: <span id="online-count">1</span>
        </div>
    </nav>

    <div class="container">
        
        <!-- SECTION: HOME -->
        <section id="home-sec" class="page-section active-section">
            <div class="card">
                <i class="fa-solid fa-infinity" style="font-size: 55px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2>LIFETIME CLOUD & SIGNALS</h2>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="f-count" style="font-size: 20px; color: var(--primary);">0</b><br><small>Files</small></div>
                    <div><b style="font-size: 20px; color: var(--trading);">VIP</b><br><small>Signals</small></div>
                </div>
                <button class="act-btn bg-blue" style="width:100%; padding:15px; margin-top:20px; color:#000; font-weight:800; border-radius:15px;" onclick="nav('signals-sec', 'n-sig')">OPEN IQ SIGNALS <i class="fa-solid fa-bolt"></i></button>
            </div>
        </section>

        <!-- SECTION: SIGNALS -->
        <section id="signals-sec" class="page-section">
            <div class="card">
                <h3 style="color: var(--trading); margin-top: 0;"><i class="fa-solid fa-chart-line"></i> LIVE IQ SIGNALS</h3>
                <div class="ai-box">
                    <div style="font-size: 13px; font-weight: 800; color: var(--primary);">EUR/USD 1m ANALYZING...</div>
                    <div id="verdict" class="verdict up">UP ▲</div>
                    <div style="background: var(--trading); color:#000; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; display: inline-block;">AI ACCURACY: 94%</div>
                    <div class="timer-bg"><div id="t-bar" class="timer-fill"></div></div>
                </div>
                <!-- TradingView Iframe (Super Light for Mobile) -->
                <div style="width:100%; height:350px; border-radius:20px; overflow:hidden;">
                    <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_762ae&symbol=FX%3AEURUSD&interval=1&hidesidetoolbar=1&hidetoptoolbar=1&symboledit=1&saveimage=1&toolbarbg=F1F3F6&studies=%5B%5D&theme=dark&style=1&timezone=Etc%2FUTC" style="width:100%; height:100%; border:none;"></iframe>
                </div>
            </div>
        </section>

        <!-- SECTION: FILES -->
        <section id="files-sec" class="page-section">
            <div class="card">
                <button class="act-btn bg-blue" style="width:100%; padding:15px; color:#000; font-weight:800; border-radius:15px;" onclick="up()"><i class="fa-solid fa-images"></i> গ্যালারি আপলোড</button>
                <div id="p-box" style="display:none; margin-top:15px; padding:10px; border:1px solid var(--primary); border-radius:15px;">
                    <small id="p-txt">0% Processing...</small>
                </div>
            </div>
            <div class="grid" id="mainGrid"></div>
        </section>

        <!-- SECTION: SETTINGS -->
        <section id="set-sec" class="page-section">
            <div class="card">
                <h3>Settings</h3>
                <p>Cloud Server: <b style="color:var(--success);">Online</b></p>
                <button class="act-btn bg-red" style="width:100%; margin-top:10px;" onclick="location.reload()">Refresh App</button>
            </div>
        </section>

    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="n-home" onclick="nav('home-sec', 'n-home')"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item" id="n-sig" onclick="nav('signals-sec', 'n-sig')"><i class="fa-solid fa-bolt"></i>Signals</button>
        <button class="nav-item" id="n-files" onclick="nav('files-sec', 'n-files')"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-item" id="n-set" onclick="nav('set-sec', 'n-set')"><i class="fa-solid fa-gear"></i>Settings</button>
    </nav>

    <!-- Async SDKs to prevent hang -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" async></script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js" async></script>

    <script>
        // বাটন ফাংশন - এটি সবার আগে রান হবে
        function nav(id, btn) {
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
            
            const btns = document.querySelectorAll('.nav-item');
            btns.forEach(b => b.classList.remove('active'));
            document.getElementById(btn).classList.add('active');
            window.scrollTo(0,0);
        }

        const SB_URL = 'https://zsluamkcuzcpnxgmhabx.supabase.co';
        const SB_KEY = 'sb_publishable_C5D72tFy_0CznaxVbg7xXQ_lcC2Us3i';
        const UC_KEY = '47591ac5fd5756296d19';
        let sb, list = [];

        // ডোম লোড হওয়ার পর সুপাবেস কানেক্ট করা
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                sb = supabase.createClient(SB_URL, SB_KEY);
                fetchVids();
                startTracker();
            }, 1000);
        });

        function startTracker() {
            const ch = sb.channel('room1');
            ch.on('presence', { event: 'sync' }, () => {
                document.getElementById('online-count').innerText = Object.keys(ch.presenceState()).length;
            }).subscribe(async (s) => { if (s === 'SUBSCRIBED') await ch.track({ at: new Date() }); });
        }

        // সিগন্যাল লজিক
        let t = 30;
        setInterval(() => {
            t--;
            const bar = document.getElementById('t-bar');
            if(bar) bar.style.width = (t/30*100) + "%";
            if(t <= 0) {
                t = 30;
                const v = document.getElementById('verdict');
                if(v) {
                    if(Math.random() > 0.5) { v.innerText = "UP ▲"; v.className = "verdict up"; }
                    else { v.innerText = "DOWN ▼"; v.className = "verdict down"; }
                }
            }
        }, 1000);

        function up() { uploadcare.openDialog(null, { publicKey: UC_KEY, tabs: 'file' }).done(f => f.progress(i => {
            const box = document.getElementById('p-box');
            box.style.display = 'block';
            document.getElementById('p-txt').innerText = Math.round(i.progress * 100) + '% Uploading...';
        }).done(info => {
            sb.from('videos').insert([{ file_id: info.uuid, file_name: info.name, file_url: `https://ucarecdn.com/${info.uuid}/video.mp4`, thumbnail_url: `https://ucarecdn.com/${info.uuid}/-/preview/640x360/` }]).then(() => {
                document.getElementById('p-box').style.display = 'none';
                fetchVids();
            });
        })); }

        async function fetchVids() {
            const { data } = await sb.from('videos').select('*').order('created_at', { ascending: false });
            if(data) {
                const grid = document.getElementById('mainGrid');
                grid.innerHTML = '';
                document.getElementById('f-count').innerText = data.length;
                data.forEach(v => {
                    grid.innerHTML += `<div class="v-card"><div class="v-thumb"><img src="${v.thumbnail_url}"></div><div class="v-title">${v.file_name}</div><div class="v-actions"><a href="${v.file_url}" target="_blank" class="act-btn bg-blue"><i class="fa-solid fa-play"></i></a><button class="act-btn bg-indigo" onclick="copyL('${v.file_url}')"><i class="fa-solid fa-link"></i></button><button class="act-btn bg-red" onclick="delV('${v.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`;
                });
            }
        }
        function copyL(u){ navigator.clipboard.writeText(u); alert('লিঙ্ক কপি হয়েছে!'); }
        async function delV(id){ if(confirm('মুছবেন?')){ await sb.from('videos').delete().eq('id',id); fetchVids(); } }
    </script>
</body>
</html>
