<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Real Cloud Pro</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 2000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        
        .live-tag { background: rgba(34, 197, 94, 0.1); padding: 5px 12px; border-radius: 20px; color: var(--success); font-size: 11px; font-weight: 700; border: 1px solid rgba(34, 197, 94, 0.2); display: flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; position: relative; }
        .pulse::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; left: 0; animation: pLive 1.5s infinite; }
        @keyframes pLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Tab Control --- */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- UI Cards --- */
        .card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* --- Storage Bar --- */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .storage-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* --- Buttons --- */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 12px; color: #fff; }
        .btn-upload { background: var(--primary); color: #000; }
        .btn-save { background: var(--success); }

        /* --- Progress Bar --- */
        #progress-area { display: none; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; border: 1px solid var(--primary); }
        .p-bar-bg { width: 100%; background: rgba(0,0,0,0.3); height: 10px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .p-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        /* --- Grid & Cards --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 10px; font-size: 12px; font-weight: 600; height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 10px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .bg-blue { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 3000; }
        .nav-item { background: none; border: none; color: var(--muted); font-size: 10px; cursor: pointer; text-align: center; width: 33.33%; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="live-tag">
            <span class="pulse"></span> Online: <span id="online-count">...</span>
        </div>
    </nav>

    <div class="container">
        
        <!-- 1. HOME SECTION -->
        <div id="section-home" class="page-section active">
            <div class="card">
                <i class="fa-solid fa-infinity" style="font-size: 55px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2 style="margin: 0; letter-spacing: 1px; font-size: 18px;">LIFETIME UNLIMITED STORAGE</h2>
                
                <div class="storage-bar"><div class="storage-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted);">
                    <span>Space Used: <b id="used-txt" style="color:#fff;">0 MB</b></span>
                    <span>Status: <b style="color:var(--success);">ACTIVE</b></span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="file-count" style="font-size: 18px; color: var(--primary);">0</b><br><small style="font-size: 9px;">TOTAL FILES</small></div>
                    <div><b style="font-size: 18px; color: var(--success);">$0.00</b><br><small style="font-size: 9px;">EST. INCOME</small></div>
                </div>
            </div>
        </div>

        <!-- 2. FILES SECTION -->
        <div id="section-files" class="page-section">
            <div class="card">
                <button class="btn btn-upload" onclick="openGallery()"><i class="fa-solid fa-images"></i> গ্যালারি থেকে আপলোড</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155; margin-top: 10px;">
                    <input type="text" id="urlInput" placeholder="এখানে ভিডিও লিঙ্ক পেস্ট করুন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-save" style="margin-top:10px; height: 45px;" onclick="saveFromUrl()"><i class="fa-solid fa-link"></i> লিঙ্ক থেকে সেভ করুন</button>
                </div>
                
                <div id="progress-area">
                    <span id="progress-text" style="font-size:12px; color:var(--primary); font-weight:700;">0% Processing...</span>
                    <div class="p-bar-bg"><div id="p-bar-fill" class="p-bar-fill"></div></div>
                </div>
            </div>
            
            <div style="margin: 15px 5px;">
                <input type="text" id="searchInput" placeholder="ভিডিও খুঁজুন..." oninput="drawUI()" style="width:100%; background:var(--card); border:1px solid rgba(255,255,255,0.1); padding:13px; border-radius:15px; color:#fff; outline:none;">
            </div>
            
            <div class="grid" id="videoGrid"></div>
        </div>

        <!-- 3. SETTINGS SECTION -->
        <div id="section-settings" class="page-section">
            <div class="card" style="text-align: left;">
                <h3 style="margin-top: 0; color: var(--primary);">System Dashboard</h3>
                <p style="font-size: 13px;">Enterprise Storage: <b style="color:var(--success);">Connected</b></p>
                <p style="font-size: 13px;">Database Engine: <b style="color:var(--success);">Supabase Cloud</b></p>
                <hr style="opacity: 0.1; margin: 20px 0;">
                <button class="btn" style="background: #334155; font-size: 13px;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="navTo('section-home', 'nav-home')"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item" id="nav-files" onclick="navTo('section-files', 'nav-files')"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-item" id="nav-settings" onclick="navTo('section-settings', 'nav-settings')"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        // --- আপনার সুপাবেস কনফিগারেশন (বস্, আমি এখানে বসিয়ে দিয়েছি) ---
        const SUPABASE_URL = 'https://zsluamkcuzcpnxgmhabx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C5D72tFy_0CznaxVbg7xXQ_lcC2Us3i';
        const UPLOADCARE_KEY = '47591ac5fd5756296d19';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let videoData = [];

        // ১. ১০০% কাজ করা নেভিগেশন (এটি এখন এরর দেবে না)
        function navTo(sectionId, navId) {
            const sections = document.querySelectorAll('.page-section');
            const navItems = document.querySelectorAll('.nav-item');
            
            sections.forEach(s => s.classList.remove('active'));
            navItems.forEach(n => n.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            document.getElementById(navId).classList.add('active');
            window.scrollTo(0,0);
        }

        // ২. রিয়েল টাইম ইউজার ট্র্যাকার (সরাসরি সংখ্যা দেখাবে)
        const channel = supabaseClient.channel('mynul_presence');
        channel.on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('online-count').innerText = Object.keys(state).length;
        }).subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() });
        });

        // ৩. আপলোড ও লিঙ্ক সেভ লজিক
        function openGallery() { uploadcare.openDialog(null, { publicKey: UPLOADCARE_KEY, tabs: 'file' }).done(file => trackFile(file)); }
        function saveFromUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url.startsWith('http')) return alert('সঠিক লিঙ্ক দিন বস্!');
            trackFile(uploadcare.fileFrom('url', url, { publicKey: UPLOADCARE_KEY }));
            document.getElementById('urlInput').value = '';
        }

        function trackFile(file) {
            const area = document.getElementById('progress-area');
            const bar = document.getElementById('p-bar-fill');
            const txt = document.getElementById('progress-text');
            area.style.display = 'block';

            file.progress(info => {
                let p = Math.round(info.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% Processing...';
            });

            file.done(info => {
                // সরাসরি CDN লিঙ্ক ব্যবহার (যাতে কখনও নষ্ট না হয়)
                saveToDB(info);
                area.style.display = 'none';
            });
        }

        async function saveToDB(info) {
            const finalLink = info.cdnUrl.replace('ucarecd.net', 'ucarecdn.com');
            const { error } = await supabaseClient.from('videos').insert([{
                file_id: info.uuid,
                file_name: info.name || "Cloud Video",
                file_url: finalLink,
                file_size: info.size,
                thumbnail_url: finalLink + '-/preview/640x360/'
            }]);
            if (!error) fetchVideos();
            else alert("Error: " + error.message);
        }

        // ৪. ডাটা লোড ও ইন্টারফেস ড্রয়িং
        async function fetchVideos() {
            const { data, error } = await supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
            if (!error) { videoData = data; drawUI(); }
        }

        function drawUI() {
            const grid = document.getElementById('videoGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            let totalBytes = 0;
            grid.innerHTML = '';

            const filtered = videoData.filter(v => v.file_name.toLowerCase().includes(term));
            filtered.forEach(v => {
                totalBytes += (v.file_size || 0);
                grid.innerHTML += `
                    <div class="v-card">
                        <div class="v-thumb"><img src="${v.thumbnail_url}" onerror="this.src='https://placehold.co/640x360/0f172a/38bdf8?text=Video'"></div>
                        <div class="v-title">${v.file_name}</div>
                        <div class="v-actions">
                            <a href="${v.file_url}" target="_blank" class="act-btn bg-blue"><i class="fa-solid fa-play"></i></a>
                            <button class="act-btn bg-indigo" onclick="copyUrl('${v.file_url}')"><i class="fa-solid fa-link"></i></button>
                            <button class="act-btn bg-red" onclick="delVideo('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('used-txt').innerText = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('file-count').innerText = videoData.length;
            if(filtered.length === 0) grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--muted);">No files found.</div>';
        }

        function copyUrl(url) {
            const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el);
            alert('লিঙ্ক কপি হয়েছে বস্!');
        }

        async function delVideo(id) {
            if(confirm('বস্, ডিলিট করতে চান?')) {
                await supabaseClient.from('videos').delete().eq('id', id);
                fetchVideos();
            }
        }

        // শুরুতে ডাটা লোড
        window.onload = fetchVideos;
    </script>
</body>
    </html>
