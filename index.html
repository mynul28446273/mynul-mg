<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Real Cloud Storage</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Configuration -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .active-badge { font-size: 10px; color: var(--primary); border: 1px solid var(--primary); padding: 2px 10px; border-radius: 20px; font-weight: 700; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Page Logic --- */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Premium Cards --- */
        .card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* Live Status Indicator */
        .live-status { 
            margin-bottom: 15px;
            background: rgba(34, 197, 94, 0.1);
            padding: 8px 15px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; margin-right: 8px; position: relative; }
        .dot::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; animation: pLive 1.5s infinite; }
        @keyframes pLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        /* Unlimited Storage Bar */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .storage-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Action Buttons */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-bottom: 12px; }
        .btn-blue { background: var(--primary); color: #000; }
        .btn-green { background: var(--success); color: #fff; }

        /* Upload Progress Area */
        #prog-box { display: none; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; height: 40px; position: relative; overflow: hidden; border: 1px solid var(--primary); }
        #prog-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        #prog-text { position: absolute; width: 100%; text-align: center; top: 10px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* Video Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); }
        .v-body { padding: 12px; }
        .v-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; text-align: center; text-decoration: none; }
        .bg-cyan { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* Bottom Menu Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-tab.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="active-badge">ULTRA CLOUD</div>
    </nav>

    <div class="container">
        
        <div id="home-sec" class="section active">
            <div class="card">
                <div class="live-status">
                    <span class="dot"></span>
                    <script id="_waumul">var _wau = _wa || []; _wau.push(["small", "mynulmg", "mul"]);</script>
                    <script async src="//waust.at/s.js"></script>
                    <span style="font-size: 11px; font-weight: 800; color: var(--success); margin-left: 5px;">REAL ACTIVE NOW</span>
                </div>
                
                <h2 style="margin: 0; letter-spacing: 1px; font-size: 18px; color: var(--primary);">UNLIMITED STORAGE</h2>
                
                <div class="storage-bar"><div class="storage-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
                    <span>Used: <b id="used-val" style="color:#fff;">0 MB</b></span>
                    <span>Status: <b style="color:var(--success);">CONNECTED</b></span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="total-files" style="font-size: 18px; color: var(--primary);">0</b><br><small style="font-size: 9px; color: var(--text-muted);">FILES</small></div>
                    <div><b style="font-size: 18px; color: var(--success);">$0.00</b><br><small style="font-size: 9px; color: var(--text-muted);">EARNINGS</small></div>
                </div>
            </div>
        </div>

        <div id="upload-sec" class="section">
            <div class="card">
                <button class="btn btn-blue" onclick="openGallery()"><i class="fa-solid fa-images"></i> Gallery Upload</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155; margin-top: 10px;">
                    <input type="text" id="urlInput" placeholder="লিঙ্ক পেস্ট করুন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-green" style="margin-top:10px; height: 45px;" onclick="openUrl()"><i class="fa-solid fa-link"></i> Save from URL</button>
                </div>
                <div id="prog-box"><div id="prog-bar"></div><div id="prog-text">0% Processing...</div></div>
            </div>
            <div style="margin: 15px 5px;">
                <input type="text" id="searchInp" placeholder="Search files..." oninput="drawUI()" style="width:100%; background:var(--card); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:12px; color:#fff; outline:none;">
            </div>
            <div class="grid" id="vGrid"></div>
        </div>

        <div id="settings-sec" class="section">
            <div class="card" style="text-align: left;">
                <h3 style="margin: 0; color: var(--primary);">Settings</h3>
                <button class="btn" style="background: var(--danger); color:#fff;" onclick="resetDB()">Clear Data (লিস্ট মুছুন)</button>
                <button class="btn" style="background: #334155; color:#fff;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <div class="bottom-nav">
        <button class="nav-tab active" onclick="nav('home-sec', this)"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-tab" onclick="nav('upload-sec', this)"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-tab" onclick="nav('settings-sec', this)"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('mynul_videos')) || [];

        function nav(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function openGallery() { uploadcare.openDialog(null, { tabs: 'file' }).done(doUpload); }
        
        function openUrl() {
            const v = document.getElementById('urlInput').value.trim();
            if(!v.startsWith('http')) return alert('Invalid Link!');
            doUpload(uploadcare.fileFrom('url', v));
            document.getElementById('urlInput').value = '';
        }

        function doUpload(file) {
            const box = document.getElementById('prog-box');
            const bar = document.getElementById('prog-bar');
            const txt = document.getElementById('prog-text');
            box.style.display = 'block';

            file.progress(i => {
                let p = Math.round(i.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% Processing...';
            });

            file.done(info => {
                // লিঙ্ক ফিক্স করা হলো (CDN URL ব্যবহার করে)
                const item = { id: info.uuid, name: info.name || "File", url: info.cdnUrl, size: info.size, date: new Date().getTime() };
                db.unshift(item);
                localStorage.setItem('mynul_videos', JSON.stringify(db));
                box.style.display = 'none';
                drawUI();
                alert('Saved successfully!');
            });
        }

        function drawUI() {
            const grid = document.getElementById('vGrid');
            const term = document.getElementById('searchInp').value.toLowerCase();
            let totalSize = 0;
            
            db.sort((a,b) => b.date - a.date);
            const filtered = db.filter(v => v.name.toLowerCase().includes(term));
            
            grid.innerHTML = '';
            db.forEach(v => {
                totalSize += (v.size || 0);
                // প্রতিটি লিঙ্কে যদি কোনো ভুল থাকে তা অটোমেটিক ফিক্স করবে
                const fixedUrl = v.url.replace('ucarecd.net', 'ucarecdn.com');
                grid.innerHTML += `<div class="v-card"><div class="v-thumb"><i class="fa-solid fa-play"></i></div><div class="v-body"><div class="v-title">${v.name}</div></div><div class="v-actions"><a href="${fixedUrl}" target="_blank" class="act-btn bg-cyan"><i class="fa-solid fa-play"></i></a><button class="act-btn bg-indigo" onclick="copy('${fixedUrl}')"><i class="fa-solid fa-link"></i></button><button class="act-btn bg-red" onclick="del('${v.id}')"><i class="fa-solid fa-trash"></i></button></div></div>`;
            });

            document.getElementById('used-val').innerText = (totalSize / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('total-files').innerText = db.length;
        }

        function del(id) { if(confirm('Delete?')) { db = db.filter(v => v.id !== id); localStorage.setItem('mynul_videos', JSON.stringify(db)); drawUI(); } }
        function resetDB() { if(confirm('Reset all?')) { localStorage.removeItem('mynul_videos'); db = []; drawUI(); } }
        function copy(url) {
            const temp = document.createElement('input'); document.body.appendChild(temp);
            temp.value = url; temp.select(); document.execCommand('copy');
            document.body.removeChild(temp); alert('Copied!');
        }
        window.onload = drawUI;
    </script>
</body>
</html>
