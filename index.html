<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Real Unlimited Cloud</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Configuration -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 2000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .badge-unlimited { font-size: 10px; color: var(--primary); border: 1px solid var(--primary); padding: 2px 10px; border-radius: 20px; font-weight: 700; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Tab Control --- */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- UI Cards --- */
        .card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        /* --- REAL LIVE TRACKER --- */
        .live-counter-box {
            background: rgba(34, 197, 94, 0.1);
            padding: 10px 15px;
            border-radius: 15px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .dot { width: 10px; height: 10px; background: var(--success); border-radius: 50%; position: relative; }
        .dot::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; left: 0; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        /* --- Storage Bar --- */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .storage-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* --- Buttons --- */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 12px; }
        .btn-upload { background: var(--primary); color: #000; }
        .btn-save { background: var(--success); color: #fff; }

        /* --- Progress Bar --- */
        #progress-area { display: none; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; height: 40px; position: relative; overflow: hidden; border: 1px solid var(--primary); }
        #progress-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        #progress-text { position: absolute; width: 100%; text-align: center; top: 10px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; }

        /* --- Grid & Cards --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); }
        .v-title { padding: 12px; font-size: 12px; font-weight: 600; height: 50px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; text-align: center; text-decoration: none; }
        .bg-play { background: var(--primary); color: #000; }
        .bg-copy { background: #6366f1; }
        .bg-del { background: var(--danger); }

        /* --- Bottom Nav (Mobile Style) --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 3000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; width: 33.33%; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        /* Hide Uploadcare Widget */
        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="badge-unlimited">UNLIMITED CLOUD</div>
    </nav>

    <div class="container">
        
        <!-- 1. HOME SECTION -->
        <div id="section-home" class="page-section active">
            <div class="card">
                <div class="live-counter-box">
                    <span class="dot"></span>
                    <!-- REAL LIVE TRACKER WIDGET -->
                    <script id="_waumul">var _wau = _wa || []; _wau.push(["small", "mynulmg", "mul"]);</script>
                    <script async src="//waust.at/s.js"></script>
                    <span style="font-weight: 800; color: var(--success); font-size: 12px; margin-left: 5px;">REAL LIVE NOW</span>
                </div>
                
                <h2 style="margin: 0; letter-spacing: 1px; font-size: 18px; color: var(--primary);">HIGH-SPEED ENTERPRISE STORAGE</h2>
                
                <div class="storage-bar"><div class="storage-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
                    <span>Used: <b id="used-txt" style="color:#fff;">0 MB</b></span>
                    <span>Status: <b style="color:var(--success);">ACTIVE</b></span>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="file-count" style="font-size: 18px; color: var(--primary);">0</b><br><small style="font-size: 9px; color: var(--text-muted);">FILES SAVED</small></div>
                    <div><b style="font-size: 18px; color: var(--success);">$0.00</b><br><small style="font-size: 9px; color: var(--text-muted);">EARNINGS</small></div>
                </div>
            </div>
        </div>

        <!-- 2. FILES SECTION -->
        <div id="section-files" class="page-section">
            <div class="card">
                <button class="btn btn-upload" onclick="openGallery()"><i class="fa-solid fa-images"></i> গ্যালারি থেকে আপলোড</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155; margin-top: 10px;">
                    <input type="text" id="urlInput" placeholder="এখানে ভিডিও লিঙ্ক দিন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-save" style="margin-top:10px; height: 45px;" onclick="saveUrl()"><i class="fa-solid fa-link"></i> লিঙ্ক থেকে সেভ করুন</button>
                </div>
                <div id="progress-area"><div id="progress-bar"></div><div id="progress-text">0% Processing...</div></div>
            </div>
            <div style="margin: 15px 5px;">
                <input type="text" id="searchInput" placeholder="ভিডিও খুঁজুন..." oninput="renderUI()" style="width:100%; background:var(--card); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:12px; color:#fff; outline:none;">
            </div>
            <div class="grid" id="videoGrid"></div>
        </div>

        <!-- 3. SETTINGS SECTION -->
        <div id="section-settings" class="page-section">
            <div class="card" style="text-align: left;">
                <h3 style="margin: 0; color: var(--primary);">একাউন্ট সেটিংস</h3>
                <p style="font-size: 13px; margin: 15px 0;">Cloud Server: <b style="color:var(--success);">Connected (CDN Pro)</b></p>
                <button class="btn" style="background: var(--danger); color:#fff; font-size: 13px;" onclick="clearLocal()">পুরো লিস্ট মুছুন (Reset)</button>
                <button class="btn" style="background: #334155; color:#fff; font-size: 13px;" onclick="location.reload()">অ্যাপ রিফ্রেশ দিন</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" id="btn-home" onclick="navTo('section-home', 'btn-home')"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item" id="btn-files" onclick="navTo('section-files', 'btn-files')"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-item" id="btn-settings" onclick="navTo('section-settings', 'btn-settings')"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        let myVideos = JSON.parse(localStorage.getItem('mynul_videos')) || [];

        // ১. নিখুঁত নেভিগেশন সিস্টেম (এটি এখন ১০০% কাজ করবে)
        function navTo(sectionId, btnId) {
            // সব সেকশন হাইড করা
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            // সব বাটন থেকে এক্টিভ কালার সরানো
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            // টার্গেট সেকশন এবং বাটন এক্টিভ করা
            document.getElementById(sectionId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
            window.scrollTo(0,0);
        }

        // ২. আপলোড ফাংশন
        function openGallery() { uploadcare.openDialog(null, { tabs: 'file' }).done(doTask); }
        function saveUrl() {
            const val = document.getElementById('urlInput').value.trim();
            if(!val.startsWith('http')) return alert('সঠিক ভিডিও লিঙ্ক দিন!');
            doTask(uploadcare.fileFrom('url', val));
            document.getElementById('urlInput').value = '';
        }

        function doTask(file) {
            const area = document.getElementById('progress-area');
            const bar = document.getElementById('progress-bar');
            const txt = document.getElementById('progress-text');
            area.style.display = 'block';

            file.progress(i => {
                let p = Math.round(i.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% আপলোড হচ্ছে...';
            });

            file.done(info => {
                // লিঙ্ক ফিক্স করা এবং সেভ করা
                const finalUrl = info.cdnUrl.replace('ucarecd.net', 'ucarecdn.com');
                const newItem = { id: info.uuid, name: info.name || "Permanent Video", url: finalUrl, size: info.size, date: new Date().getTime() };
                myVideos.unshift(newItem);
                localStorage.setItem('mynul_videos', JSON.stringify(myVideos));
                area.style.display = 'none';
                renderUI();
                alert('সফলভাবে ক্লাউডে সেভ হয়েছে!');
            });
        }

        // ৩. ইন্টারফেস আপডেট (রিয়েল ডাটা শো)
        function renderUI() {
            const grid = document.getElementById('videoGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            let totalB = 0;
            
            myVideos.sort((a,b) => b.date - a.date);
            const list = myVideos.filter(v => v.name.toLowerCase().includes(term));
            
            grid.innerHTML = '';
            myVideos.forEach(v => totalB += (v.size || 0));

            if(list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted);">No videos found.</div>';
            } else {
                list.forEach(v => {
                    const cleanUrl = v.url.replace('ucarecd.net', 'ucarecdn.com');
                    grid.innerHTML += `
                        <div class="v-card">
                            <div class="v-thumb"><i class="fa-solid fa-play"></i></div>
                            <div class="v-title">${v.name}</div>
                            <div class="v-actions">
                                <a href="${cleanUrl}" target="_blank" class="act-btn bg-play"><i class="fa-solid fa-play"></i></a>
                                <button class="act-btn bg-copy" onclick="copyIt('${cleanUrl}')"><i class="fa-solid fa-link"></i></button>
                                <button class="act-btn bg-del" onclick="delIt('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            }

            document.getElementById('used-txt').innerText = (totalB / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('file-count').innerText = myVideos.length;
        }

        function delIt(id) { if(confirm('ডিলিট করবেন?')) { myVideos = myVideos.filter(v => v.id !== id); localStorage.setItem('mynul_videos', JSON.stringify(myVideos)); renderUI(); } }
        function clearLocal() { if(confirm('সব মুছবেন?')) { localStorage.removeItem('mynul_videos'); myVideos = []; renderUI(); } }
        function copyIt(url) {
            const temp = document.createElement('input'); document.body.appendChild(temp);
            temp.value = url; temp.select(); document.execCommand('copy');
            document.body.removeChild(temp); alert('লিঙ্ক কপি হয়েছে বস্!');
        }

        // পেজ লোড হলে UI দেখানো
        window.onload = renderUI;
    </script>
</body>
</html>
