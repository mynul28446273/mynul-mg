<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Unlimited Cloud Pro</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 100px; overflow-x: hidden; }

        /* --- Navbar --- */
        .navbar { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 2000; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        
        .live-tag { background: rgba(34, 197, 94, 0.1); padding: 5px 12px; border-radius: 20px; color: var(--success); font-size: 11px; font-weight: 700; border: 1px solid rgba(34, 197, 94, 0.2); display: flex; align-items: center; gap: 8px; }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; position: relative; }
        .pulse::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; left: 0; animation: pLive 1.5s infinite; }
        @keyframes pLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Page Switch --- */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* --- Premium Cards --- */
        .card { background: var(--card); padding: 25px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        /* Storage Meter Animation */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Buttons */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; margin-bottom: 12px; color: #fff; }
        .btn-upload { background: var(--primary); color: #000; }
        .btn-url { background: var(--success); }

        /* Progress Area */
        #prog-box { display: none; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid var(--primary); }

        /* Search & Grid */
        .search-area { background: var(--card); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .search-area input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); overflow: hidden; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 10px; font-size: 11px; font-weight: 600; height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 12px; text-align: center; text-decoration: none; }
        .bg-blue { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 3000; }
        .nav-btn { background: none; border: none; color: var(--muted); font-size: 10px; cursor: pointer; text-align: center; flex: 1; }
        .nav-btn i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-btn.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="live-tag">
            <span class="pulse"></span> Online: <span id="online-count">1</span>
        </div>
    </nav>

    <div class="container">
        
        <!-- PAGE 1: HOME -->
        <div id="page-home" class="section active">
            <div class="card">
                <i class="fa-solid fa-infinity" style="font-size: 50px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2 style="margin:0; letter-spacing: 1px;">UNLIMITED STORAGE</h2>
                <div class="storage-bar"><div class="fill"></div></div>
                <div style="display:flex; justify-content: space-between; font-size: 11px; color: var(--muted);">
                    <span>ব্যবহৃত: <b id="used-txt" style="color:#fff;">0 MB</b></span>
                    <span>লিমিট: <b style="color:var(--primary);">NO LIMIT</b></span>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="file-count" style="font-size: 20px; color: var(--primary);">0</b><br><small>Total Files</small></div>
                    <div><b style="font-size: 20px; color: var(--success);">$0.00</b><br><small>Bal</small></div>
                </div>
            </div>
        </div>

        <!-- PAGE 2: FILES -->
        <div id="page-files" class="section">
            <div class="card">
                <button class="btn btn-upload" onclick="openGallery()"><i class="fa-solid fa-images"></i> গ্যালারি থেকে আপলোড</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155;">
                    <input type="text" id="urlInput" placeholder="ভিডিওর সরাসরি লিঙ্ক দিন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-url" style="margin-top:10px; height: 45px;" onclick="saveUrl()"><i class="fa-solid fa-cloud-arrow-down"></i> লিঙ্ক থেকে সেভ করুন</button>
                </div>
            </div>

            <div id="prog-box">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;">
                    <span id="prog-text">0% Processing...</span>
                </div>
                <div class="storage-bar"><div id="prog-bar" class="fill" style="width:0%; animation:none;"></div></div>
            </div>

            <div class="search-area">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--muted);"></i>
                <input type="text" id="searchInput" placeholder="Search your archive..." oninput="drawUI()">
            </div>

            <div class="grid" id="mainGrid"></div>
        </div>

        <!-- PAGE 3: SETTINGS -->
        <div id="page-settings" class="section">
            <div class="card" style="text-align: left;">
                <h3 style="margin-top:0; color:var(--primary);"><i class="fa-solid fa-gear"></i> একাউন্ট সেটিংস</h3>
                <p style="font-size:13px;">Enterprise Cloud: <b style="color:var(--success);">Connected</b></p>
                <p style="font-size:13px;">Storage Type: <b style="color:var(--success);">Lifetime Unlimited</b></p>
                <p style="font-size:13px;">Account ID: <b>MNL-6273-PRO</b></p>
                <hr style="opacity:0.1; margin:20px 0;">
                <button class="btn" style="background: #334155;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-btn active" id="nav-home" onclick="nav('page-home', 'nav-home')"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-btn" id="nav-files" onclick="nav('page-files', 'nav-files')"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-btn" id="nav-settings" onclick="nav('page-settings', 'nav-settings')"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        // --- আপনার সুপাবেস কনফিগারেশন ---
        const SUPABASE_URL = 'https://zsluamkcuzcpnxgmhabx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C5D72tFy_0CznaxVbg7xXQ_lcC2Us3i'; 

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let videoDB = [];

        // ১. রিয়েল টাইম অনলাইন ইউজার কাউন্টার (Supabase Presence)
        const channel = supabaseClient.channel('online-users', { config: { presence: { key: 'user' } } });
        channel.on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('online-count').innerText = Object.keys(state).length;
        }).subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() });
        });

        // ২. নেভিগেশন ফিক্স
        function nav(pageId, btnId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById(btnId).classList.add('active');
            window.scrollTo(0,0);
        }

        // ৩. গ্যালারি ও লিঙ্ক আপলোড লজিক
        function openGallery() {
            uploadcare.openDialog(null, { publicKey: '47591ac5fd5756296d19', tabs: 'file' }).done(file => trackProgress(file));
        }

        function saveUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url.startsWith('http')) return alert('সঠিক লিঙ্ক দিন!');
            const file = uploadcare.fileFrom('url', url, { publicKey: '47591ac5fd5756296d19' });
            trackProgress(file);
            document.getElementById('urlInput').value = '';
        }

        function trackProgress(file) {
            const box = document.getElementById('prog-box');
            const bar = document.getElementById('prog-bar');
            const txt = document.getElementById('prog-text');
            box.style.display = 'block';

            file.progress(info => {
                let p = Math.round(info.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% আপলোড হচ্ছে...';
            });

            file.done(info => {
                saveToSupabase(info);
                box.style.display = 'none';
            });
        }

        // ৪. ডাটাবেসে সেভ (Cloud Sync)
        async function saveToSupabase(info) {
            const { error } = await supabaseClient.from('videos').insert([{
                file_id: info.uuid,
                file_name: info.name || "Cloud Video",
                file_url: `https://ucarecdn.com/${info.uuid}/video.mp4`,
                file_size: info.size,
                thumbnail_url: `https://ucarecdn.com/${info.uuid}/-/preview/320x180/`
            }]);
            if (error) alert("Database Error: " + error.message);
            else fetchVideos();
        }

        // ৫. ডাটা লোড ও রেন্ডারিং
        async function fetchVideos() {
            const { data, error } = await supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
            if (!error) { videoDB = data; drawUI(); }
        }

        function drawUI() {
            const grid = document.getElementById('mainGrid');
            const term = document.getElementById('searchInput').value.toLowerCase();
            let totalSize = 0;
            grid.innerHTML = '';

            const filtered = videoDB.filter(v => v.file_name.toLowerCase().includes(term));
            
            filtered.forEach(v => {
                totalSize += (v.file_size || 0);
                grid.innerHTML += `
                    <div class="v-card">
                        <div class="v-thumb"><img src="${v.thumbnail_url}"></div>
                        <div class="v-title">${v.file_name}</div>
                        <div class="v-actions">
                            <a href="${v.file_url}" target="_blank" class="act-btn bg-blue"><i class="fa-solid fa-play"></i></a>
                            <button class="act-btn bg-indigo" onclick="copyL('${v.file_url}')"><i class="fa-solid fa-link"></i></button>
                            <button class="act-btn bg-red" onclick="delV('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });

            // স্ট্যাটাস আপডেট
            document.getElementById('used-txt').innerText = (totalSize / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('file-count').innerText = videoDB.length;
        }

        function copyL(url) {
            navigator.clipboard.writeText(url).then(() => alert('লিঙ্ক কপি হয়েছে! এবার শর্টনারে ব্যবহার করুন।'));
        }

        async function delV(id) {
            if(confirm('বস্, এই ভিডিওটি কি লিস্ট থেকে সরাতে চান?')) {
                const { error } = await supabaseClient.from('videos').delete().eq('id', id);
                if (!error) fetchVideos();
            }
        }

        window.onload = fetchVideos;
    </script>
</body>
</html>
