<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - AI Video Master</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare SDK -->
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root { 
            --primary: #a855f7; /* AI Purple */
            --bg: #020617; 
            --card: #0f172a; 
            --accent: #38bdf8;
            --success: #2ed573;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background-color: var(--bg); 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* --- Header --- */
        .navbar { 
            width: 100%;
            background: var(--card); 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            position: sticky; top: 0; z-index: 5000;
            border-radius: 0 0 20px 20px;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--primary); text-decoration: none; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        .badge { background: var(--primary); color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; }

        .app-container { width: 100%; max-width: 500px; margin-top: 20px; }

        /* --- AI Interface Card --- */
        .ai-card {
            background: var(--card);
            border-radius: 30px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Photo Upload Area */
        .upload-trigger {
            width: 100%;
            aspect-ratio: 16/9;
            background: rgba(0,0,0,0.3);
            border: 2px dashed var(--primary);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .upload-trigger:hover { background: rgba(168, 85, 247, 0.1); }
        .upload-trigger img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .upload-placeholder i { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
        .upload-placeholder span { font-size: 13px; color: var(--muted); font-weight: 600; }

        /* Input Area */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 12px; font-weight: 700; color: var(--primary); margin-left: 5px; text-transform: uppercase; }
        textarea {
            width: 100%;
            height: 90px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: #fff;
            padding: 15px;
            margin-top: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            transition: 0.3s;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }

        .gen-btn {
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: #fff;
            width: 100%;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
            transition: 0.3s;
        }
        .gen-btn:active { transform: scale(0.98); }
        .gen-btn:disabled { opacity: 0.5; cursor: not-allowed; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- Result Section --- */
        .result-area { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
        .video-box {
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--primary);
            position: relative;
        }
        video { width: 100%; display: block; }
        
        .dl-btn {
            background: var(--success);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 800;
            margin-top: 15px;
        }

        .uploadcare--widget { display: none !important; }
        .loading-text { font-size: 12px; color: var(--primary); font-weight: 700; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="badge">AI VIDEO PRO</div>
    </nav>

    <div class="app-container">
        <div class="ai-card">
            <h2 style="margin: 0 0 10px; font-weight: 900;">AI VIDEO GENERATOR</h2>
            <p style="color: var(--muted); font-size: 12px; margin-bottom: 25px;">ফটো আপলোড করুন এবং এআই দিয়ে ভিডিও বানান।</p>

            <!-- Photo Upload Trigger -->
            <div class="upload-trigger" id="photoBox" onclick="openUploader()">
                <div class="upload-placeholder" id="placeholder">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <br><span>Upload a Photo</span>
                </div>
                <img id="previewImg" src="">
            </div>

            <!-- Text Prompt -->
            <div class="input-group">
                <label>Video Instructions</label>
                <textarea id="promptInp" placeholder="ভিডিওটিতে কী ঘটবে লিখে দিন... (যেমন: Realistic fire movement in background)"></textarea>
            </div>

            <button id="genBtn" class="gen-btn" onclick="startGeneration()">
                <i class="fa-solid fa-wand-magic-sparkles"></i> GENERATE VIDEO
            </button>
            
            <div id="statusTxt" class="loading-text">AI is thinking... 0%</div>
        </div>

        <!-- Result Preview -->
        <div class="result-area" id="resultArea">
            <h3 style="text-align: center; color: var(--primary);">Generated Video</h3>
            <div class="video-box">
                <video id="outputVid" controls loop playsinline></video>
            </div>
            <a id="dlLink" href="#" download="ai_video_mynul.mp4" class="dl-btn">
                <i class="fa-solid fa-download"></i> DOWNLOAD VIDEO
            </a>
            <button class="btn" style="background: none; border: 1px solid var(--muted); color: var(--muted); margin-top: 15px; width: 100%; border-radius: 10px; padding: 10px;" onclick="location.reload()">Create New</button>
        </div>
    </div>

    <div style="margin-top: 40px; color: var(--muted); font-size: 11px; text-align: center;">
        Powered by mynul.mg Enterprise AI | 2024
    </div>

    <!-- Hidden Uploadcare Widget -->
    <input type="hidden" id="uc-widget">

    <script>
        const UC_KEY = '47591ac5fd5756296d19';
        let uploadedImageUrl = "";

        // ১. ফটো আপলোডার ওপেন করা
        function openUploader() {
            uploadcare.openDialog(null, {
                publicKey: UC_KEY,
                tabs: 'file',
                imagesOnly: true
            }).done(file => {
                file.done(info => {
                    uploadedImageUrl = info.cdnUrl;
                    document.getElementById('previewImg').src = info.cdnUrl;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('placeholder').style.display = 'none';
                    document.getElementById('photoBox').style.borderStyle = 'solid';
                });
            });
        }

        // ২. ভিডিও জেনারেশন লজিক
        async function startGeneration() {
            const prompt = document.getElementById('promptInp').value.trim();
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('statusTxt');
            const result = document.getElementById('resultArea');
            const video = document.getElementById('outputVid');

            if(!uploadedImageUrl) return alert('বস্, আগে একটি ফটো আপলোড করুন!');
            if(!prompt) return alert('ভিডিওটি কেমন হবে লিখে দিন!');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERATING...';
            status.style.display = 'block';

            // প্রগ্রেস বার সিমুলেশন (যেহেতু এআই সার্ভার ব্যাকগ্রাউন্ডে কাজ করে)
            let p = 0;
            const interval = setInterval(() => {
                p += Math.floor(Math.random() * 5) + 1;
                if(p > 99) p = 99;
                status.innerText = "AI is animating your photo... " + p + "%";
            }, 500);

            // এআই এপিআই কল (Pollinations AI for Visual Motion)
            // এটি আপনার ইমেজ এবং টেক্সট নিয়ে একটি ডাইনামিক ভিডিও লুপ জেনারেট করবে
            const seed = Math.floor(Math.random() * 1000000);
            const aiVideoUrl = `https://pollinations.ai/p/${encodeURIComponent(prompt + " based on " + uploadedImageUrl)}?width=1280&height=720&seed=${seed}&model=video`;

            // ভিডিও প্রসেসিং শেষ হওয়ার অপেক্ষা (ফ্রি এআই-এর জন্য ১০ সেকেন্ড সময় দিন)
            setTimeout(() => {
                clearInterval(interval);
                status.style.display = 'none';
                btn.innerHTML = '<i class="fa-solid fa-check"></i> DONE!';
                
                // রেজাল্ট দেখানো
                result.style.display = 'block';
                video.src = aiVideoUrl;
                document.getElementById('dlLink').href = aiVideoUrl;
                video.play();
                
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> GENERATE AGAIN';
            }, 8000);
        }
    </script>
</body>
</html>
