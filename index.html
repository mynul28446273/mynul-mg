<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Cloud Storage & Auto-Repair</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Configuration -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root { --primary: #38bdf8; --bg: #020617; --card: #1e293b; --danger: #ef4444; --success: #22c55e; --text-muted: #94a3b8; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 100px; overflow-x: hidden; }
        .navbar { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card); padding: 25px 20px; border-radius: 25px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .live-box { margin-bottom: 15px; background: rgba(34, 197, 94, 0.1); padding: 8px 15px; border-radius: 15px; display: inline-flex; align-items: center; border: 1px solid rgba(34, 197, 94, 0.2); }
        .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; margin-right: 8px; position: relative; }
        .dot::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; animation: pPulse 1.5s infinite; }
        @keyframes pPulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .storage-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-bottom: 12px; }
        .btn-blue { background: var(--primary); color: #000; }
        .btn-green { background: var(--success); color: #fff; }
        #upload-prog { display: none; margin-top: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; height: 40px; position: relative; overflow: hidden; border: 1px solid var(--primary); }
        #upload-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        #upload-text { position: absolute; width: 100%; text-align: center; top: 10px; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 1px 1px 2px #000; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); }
        .v-body { padding: 12px; }
        .v-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .v-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 13px; text-align: center; }
        .bg-cyan { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: var(--primary); }
        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div style="font-size: 10px; color: var(--primary); border: 1px solid var(--primary); padding: 2px 10px; border-radius: 20px; font-weight: 700;">PRO-FIXED</div>
    </nav>

    <div class="container">
        <!-- SECTION: HOME -->
        <div id="home-sec" class="section active">
            <div class="card">
                <div class="live-box">
                    <span class="dot"></span>
                    <script id="_waumul">var _wau = _wa || []; _wau.push(["small", "mynulmg", "mul"]);</script>
                    <script async src="//waust.at/s.js"></script>
                    <span style="font-size: 11px; font-weight: 800; color: var(--success); margin-left: 5px;">LIVE USERS NOW</span>
                </div>
                <h2 style="margin: 0; letter-spacing: 1px; font-size: 18px; color: var(--primary);">UNLIMITED CLOUD STORAGE</h2>
                <div class="storage-bar"><div class="storage-fill"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted);">
                    <span>Used: <b id="total-used-val" style="color:#fff;">0 MB</b></span>
                    <span>Limit: <b style="color:var(--primary);">NO LIMIT</b></span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="file-count" style="font-size: 18px; color: var(--primary);">0</b><br><small style="font-size: 9px; color: var(--text-muted);">FILES SAVED</small></div>
                    <div><b style="font-size: 18px; color: var(--success);">$0.00</b><br><small style="font-size: 9px; color: var(--text-muted);">EARNINGS</small></div>
                </div>
            </div>
        </div>

        <!-- SECTION: UPLOADS -->
        <div id="upload-sec" class="section">
            <div class="card">
                <button class="btn btn-blue" onclick="openGallery()"><i class="fa-solid fa-images"></i> গ্যালারি থেকে আপলোড</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155; margin-top: 10px;">
                    <input type="text" id="urlInput" placeholder="এখানে ভিডিও লিঙ্ক পেস্ট করুন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-green" style="margin-top:10px; height: 45px;" onclick="saveLink()"><i class="fa-solid fa-cloud-arrow-down"></i> লিঙ্ক থেকে সেভ করুন</button>
                </div>
                <div id="upload-prog"><div id="upload-bar"></div><div id="upload-text">0% Processing...</div></div>
            </div>
            <div style="margin: 15px 5px;">
                <input type="text" id="searchBox" placeholder="Search saved files..." oninput="updateUI()" style="width:100%; background:var(--card); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:12px; color:#fff; outline:none;">
            </div>
            <div class="grid" id="mainGrid"></div>
        </div>

        <!-- SECTION: SETTINGS -->
        <div id="settings-sec" class="section">
            <div class="card" style="text-align: left;">
                <h3 style="margin: 0; color: var(--primary);">System Database</h3>
                <p id="repair-status" style="font-size: 12px; color: var(--success); margin: 10px 0;">All links are optimized.</p>
                <button class="btn" style="background: var(--danger); color:#fff;" onclick="clearStorage()">পুরো লিস্ট মুছে ফেলুন (Reset)</button>
                <button class="btn" style="background: #334155; color:#fff;" onclick="location.reload()">অ্যাপ রিফ্রেশ দিন</button>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home-sec', this)"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item" onclick="switchPage('upload-sec', this)"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-item" onclick="switchPage('settings-sec', this)"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        let myData = JSON.parse(localStorage.getItem('mynul_videos')) || [];

        // --- বস্, এই ফাংশনটি আপনার পুরনো সব ভিডিওর লিঙ্ক অটোমেটিক ঠিক করে দেবে ---
        function repairLinks() {
            let repaired = false;
            myData = myData.map(v => {
                if (v.url.includes('ucarecd.net')) {
                    v.url = v.url.replace('ucarecd.net', 'ucarecdn.com');
                    repaired = true;
                }
                return v;
            });
            if (repaired) {
                localStorage.setItem('mynul_videos', JSON.stringify(myData));
                console.log("Old links repaired successfully.");
            }
        }

        function switchPage(pageId, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            btn.classList.add('active');
        }

        function openGallery() { uploadcare.openDialog(null, { tabs: 'file' }).done(handleUploadProcess); }
        function saveLink() {
            const val = document.getElementById('urlInput').value.trim();
            if(!val.startsWith('http')) return alert('সঠিক লিঙ্ক দিন!');
            handleUploadProcess(uploadcare.fileFrom('url', val));
            document.getElementById('urlInput').value = '';
        }

        function handleUploadProcess(file) {
            const pBox = document.getElementById('upload-prog');
            const pBar = document.getElementById('upload-bar');
            const pTxt = document.getElementById('upload-text');
            pBox.style.display = 'block';
            file.progress(info => {
                let percent = Math.round(info.progress * 100);
                pBar.style.width = percent + '%';
                pTxt.innerText = percent + '% Processing...';
            });
            file.done(info => {
                const videoEntry = { 
                    id: info.uuid, 
                    name: info.name || "Permanent Video", 
                    url: info.cdnUrl, // এটি অটোমেটিক .com লিঙ্ক দেবে
                    size: info.size, 
                    timestamp: new Date().getTime() 
                };
                myData.unshift(videoEntry);
                localStorage.setItem('mynul_videos', JSON.stringify(myData));
                pBox.style.display = 'none';
                updateUI();
                alert('সফলভাবে সেভ হয়েছে!');
            });
        }

        function updateUI() {
            const gridEl = document.getElementById('mainGrid');
            const searchKey = document.getElementById('searchBox').value.toLowerCase();
            let totalBytes = 0;
            myData.sort((a,b) => b.timestamp - a.timestamp);
            const listFiltered = myData.filter(v => v.name.toLowerCase().includes(searchKey));
            gridEl.innerHTML = '';
            myData.forEach(v => totalBytes += (v.size || 0));

            if(listFiltered.length === 0) {
                gridEl.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted);">No videos found.</div>';
            } else {
                listFiltered.forEach(v => {
                    gridEl.innerHTML += `
                        <div class="v-card">
                            <div class="v-thumb"><i class="fa-solid fa-play"></i></div>
                            <div class="v-body"><div class="v-title">${v.name}</div></div>
                            <div class="v-actions">
                                <a href="${v.url}" target="_blank" class="v-btn bg-cyan"><i class="fa-solid fa-play"></i></a>
                                <button class="v-btn bg-indigo" onclick="copyFinalUrl('${v.url}')"><i class="fa-solid fa-link"></i></button>
                                <button class="v-btn bg-red" onclick="deleteVideo('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            }
            document.getElementById('total-used-val').innerText = (totalBytes / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('file-count').innerText = myData.length;
        }

        function deleteVideo(id) { if(confirm('ডিলিট করবেন?')) { myData = myData.filter(v => v.id !== id); localStorage.setItem('mynul_videos', JSON.stringify(myData)); updateUI(); } }
        function clearStorage() { if(confirm('সব মুছে ফেলবেন?')) { localStorage.removeItem('mynul_videos'); myData = []; updateUI(); } }
        function copyFinalUrl(url) {
            const dummy = document.createElement('input'); document.body.appendChild(dummy);
            dummy.value = url; dummy.select(); document.execCommand('copy');
            document.body.removeChild(dummy); alert('লিঙ্ক কপি হয়েছে বস্!');
        }

        window.onload = () => {
            repairLinks(); // পুরনো লিঙ্ক ঠিক করা
            updateUI();
        };
    </script>
</body>
</html>
