<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Premium Cloud Storage</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- SDKs (সুপাবেস লাইব্রেরি যোগ করা হয়েছে) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <script>
        // Uploadcare Configuration
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
    </script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 100px;
        }

        /* Navbar */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* Navigation Logic */
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Cards */
        .card {
            background: var(--card);
            padding: 25px 20px;
            border-radius: 25px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
        }

        .btn {
            width: 100%; border: none; padding: 16px; border-radius: 15px;
            font-weight: 700; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; margin-bottom: 12px;
        }
        .btn-blue { background: var(--primary); color: #000; }
        .btn-green { background: var(--success); color: #fff; }

        /* Link Input Box */
        .link-area {
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px;
            border: 1px solid #334155; margin-top: 5px;
        }
        .link-area input {
            width: 100%; background: transparent; border: none; color: #fff;
            padding: 10px; outline: none; text-align: center; font-size: 14px;
        }

        /* Progress Bar */
        #prog-box {
            display: none; margin-top: 20px; background: rgba(255,255,255,0.1);
            border-radius: 12px; height: 35px; position: relative; overflow: hidden;
            border: 1px solid var(--primary);
        }
        #prog-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }
        #prog-text { position: absolute; width: 100%; text-align: center; top: 8px; font-size: 12px; font-weight: 800; color: #fff; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,0.1); overflow: hidden; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-body { padding: 12px; }
        .v-title { font-size: 12px; font-weight: 600; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 5px; }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 12px; text-align: center; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .bg-cyan { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 10px; cursor: pointer; text-align: center; }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-tab.active { color: var(--primary); }

        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo" onclick="location.reload()">mynul.mg</a>
        <div style="font-size: 11px; color: var(--primary); border: 1px solid; padding: 2px 10px; border-radius: 20px; font-weight: 700;">PRO</div>
    </nav>

    <div class="container">
        
        <!-- HOME SECTION -->
        <div id="home-sec" class="section active">
            <div class="card" style="padding: 50px 20px;">
                <i class="fa-solid fa-cloud-bolt" style="font-size: 60px; color: var(--primary); margin-bottom: 20px;"></i>
                <h2>Welcome Back, Mynul</h2>
                <div style="margin-top: 30px; display: flex; justify-content: center; gap: 30px;">
                    <div><b id="total-count" style="font-size: 24px; color: var(--primary);">0</b><br><small>Files</small></div>
                    <div style="border-left: 1px solid rgba(255,255,255,0.1); padding-left: 30px;"><b style="font-size: 24px; color: var(--success);">$0.00</b><br><small>Income</small></div>
                </div>
            </div>
        </div>

        <!-- UPLOADS SECTION -->
        <div id="upload-sec" class="section">
            <div class="card">
                <button class="btn btn-blue" onclick="fromGallery()"><i class="fa-solid fa-images"></i> Upload from Gallery</button>
                <div class="link-area">
                    <input type="text" id="linkInput" placeholder="এখানে ভিডিও লিঙ্ক পেস্ট করুন...">
                    <button class="btn btn-green" style="margin-top:10px; height: 45px;" onclick="fromUrl()"><i class="fa-solid fa-cloud-arrow-down"></i> Save from Link</button>
                </div>

                <div id="prog-box"><div id="prog-bar"></div><div id="prog-text">0% Processing...</div></div>

                <div style="margin-top: 20px; position: relative;">
                    <input type="text" id="vSearch" placeholder="Search..." oninput="showUI()" style="width:100%; background:var(--bg); border:1px solid #334155; padding:12px; border-radius:12px; color:#fff; outline:none;">
                </div>
            </div>
            <div class="grid" id="vGrid"></div>
        </div>

        <!-- SETTINGS SECTION -->
        <div id="settings-sec" class="section">
            <div class="card" style="text-align: left;">
                <h3>Cloud Settings</h3>
                <p style="font-size: 13px;">Database: <span style="color:var(--success)">Connected to Supabase</span></p>
                <button class="btn" style="background: var(--danger); color:#fff;" onclick="clearHistory()">Clear All Data</button>
                <button class="btn" style="background: #334155; color:#fff;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Bottom Menu -->
    <div class="bottom-nav">
        <button class="nav-tab active" onclick="go('home-sec', this)"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-tab" onclick="go('upload-sec', this)"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-tab" onclick="go('settings-sec', this)"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        // --- সুপাবেস কানেকশন ---
        const SUPABASE_URL = 'https://zsluamkcuzcpnxgmhabx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C5D72tFy_0CznaxVbg7xXQ_lcC2Us3i';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let db = [];

        function go(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        async function fetchFromCloud() {
            const { data, error } = await supabaseClient.from('videos').select('*').order('created_at', { ascending: false });
            if (!error) {
                db = data;
                showUI();
            }
        }

        function fromGallery() {
            uploadcare.openDialog(null, { tabs: 'file' }).done(uploadFile);
        }

        function fromUrl() {
            const val = document.getElementById('linkInput').value.trim();
            if(!val.startsWith('http')) return alert('সঠিক লিঙ্ক দিন!');
            uploadFile(uploadcare.fileFrom('url', val));
            document.getElementById('linkInput').value = '';
        }

        function uploadFile(file) {
            const box = document.getElementById('prog-box');
            const bar = document.getElementById('prog-bar');
            const txt = document.getElementById('prog-text');
            box.style.display = 'block';

            file.progress(i => {
                let p = Math.round(i.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% Processing...';
            });

            file.done(async (info) => {
                // ভিডিওর সঠিক লিঙ্ক তৈরি (ucarecdn.com ব্যবহার করে)
                const finalUrl = `https://ucarecdn.com/${info.uuid}/video.mp4`;
                const thumbUrl = `https://ucarecdn.com/${info.uuid}/-/preview/640x360/`;

                // সুপাবেসে সেভ করা
                const { error } = await supabaseClient.from('videos').insert([{
                    file_id: info.uuid,
                    file_name: info.name || "Cloud Video",
                    file_url: finalUrl,
                    thumbnail_url: thumbUrl,
                    file_size: info.size
                }]);

                box.style.display = 'none';
                if (!error) {
                    alert('সফলভাবে ক্লাউডে সেভ হয়েছে!');
                    fetchFromCloud();
                } else {
                    alert('সেভ করতে সমস্যা হয়েছে: ' + error.message);
                }
            });
        }

        function showUI() {
            const grid = document.getElementById('vGrid');
            const term = document.getElementById('vSearch').value.toLowerCase();
            
            const filtered = db.filter(v => (v.file_name || "").toLowerCase().includes(term));
            
            grid.innerHTML = '';
            document.getElementById('total-count').innerText = db.length;

            if(filtered.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted);">No files found.</div>'; return; }

            filtered.forEach(v => {
                grid.innerHTML += `
                    <div class="v-card">
                        <div class="v-thumb"><img src="${v.thumbnail_url}" onerror="this.src='https://placehold.co/640x360/020617/38bdf8?text=Video'"></div>
                        <div class="v-body"><div class="v-title">${v.file_name}</div></div>
                        <div class="v-actions">
                            <a href="${v.file_url}" target="_blank" class="act-btn bg-cyan"><i class="fa-solid fa-play"></i></a>
                            <button class="act-btn bg-indigo" onclick="copy('${v.file_url}')"><i class="fa-solid fa-link"></i></button>
                            <button class="act-btn bg-red" onclick="remove('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
        }

        async function remove(id) {
            if(confirm('বস্, এই ভিডিওটি কি লিস্ট থেকে মুছতে চান?')) {
                const { error } = await supabaseClient.from('videos').delete().eq('id', id);
                if (!error) fetchFromCloud();
            }
        }

        async function clearHistory() {
            if(confirm('বস্, আপনি কি আপনার সব ডাটা মুছে ফেলতে চান?')) {
                const { error } = await supabaseClient.from('videos').delete().neq('id', '00000000-0000-0000-0000-000000000000');
                if (!error) fetchFromCloud();
            }
        }

        function copy(url) {
            const inp = document.createElement('textarea');
            document.body.appendChild(inp);
            inp.value = url;
            inp.select();
            document.execCommand('copy');
            document.body.removeChild(inp);
            alert('লিঙ্ক কপি হয়েছে বস্!');
        }

        window.onload = fetchFromCloud;
    </script>
</body>
</html>
