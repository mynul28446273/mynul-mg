<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Premium Archive</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Uploadcare Widget Config -->
    <script>
        UPLOADCARE_PUBLIC_KEY = '47591ac5fd5756296d19';
        UPLOADCARE_TABS = 'file';
    </script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg-dark: #020617;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        .navbar {
            background: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }

        .container { max-width: 900px; margin: 0 auto; padding: 15px; }

        /* --- Page Sections --- */
        .page-section { display: none; animation: fadeIn 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Upload Management Layout --- */
        .archive-controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 25px;
        }

        .search-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-box { flex: 1; position: relative; }
        .search-box input {
            width: 100%; background: var(--bg-dark); border: 1px solid #334155;
            padding: 12px 12px 12px 40px; border-radius: 14px; color: #fff; outline: none;
        }
        .search-box i { position: absolute; left: 15px; top: 14px; color: var(--text-muted); }

        .sort-select {
            background: var(--bg-dark); color: #fff; border: 1px solid #334155;
            padding: 10px; border-radius: 14px; outline: none; font-size: 13px;
        }

        .btn-upload-big {
            width: 100%; background: var(--primary); color: #000;
            border: none; padding: 16px; border-radius: 16px;
            font-weight: 800; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s;
        }

        /* --- Progress Bar --- */
        #progress-container {
            display: none; margin-top: 15px; background: rgba(255,255,255,0.05);
            border-radius: 10px; height: 25px; position: relative; overflow: hidden;
        }
        #progress-bar {
            height: 100%; width: 0%; background: var(--primary);
            transition: width 0.3s; display: flex; align-items: center; justify-content: center;
        }
        #progress-text { font-size: 11px; font-weight: 800; color: #000; position: absolute; width: 100%; text-align: center; }

        /* --- Video Grid --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }

        .video-card {
            background: var(--card-bg); border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column;
        }

        .thumb {
            width: 100%; aspect-ratio: 4/3; background: #000;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .thumb i { font-size: 35px; color: rgba(255,255,255,0.1); }
        
        .card-info { padding: 12px; flex-grow: 1; }
        .v-name { font-size: 12px; font-weight: 600; margin-bottom: 5px; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .v-date { font-size: 10px; color: var(--text-muted); }

        .card-actions {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 5px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .btn-sm { border: none; padding: 8px; border-radius: 8px; font-size: 11px; cursor: pointer; color: #fff; text-align: center; text-decoration: none; }
        .bg-blue { background: var(--primary); color: #000; }
        .bg-gray { background: #334155; }
        .bg-red { background: var(--danger); }

        /* --- Bottom Tabs --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #111827; display: flex; justify-content: space-around;
            padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 2000;
        }
        .nav-tab { color: var(--text-muted); text-decoration: none; text-align: center; font-size: 10px; border: none; background: none; cursor: pointer; }
        .nav-tab i { font-size: 22px; display: block; margin-bottom: 3px; }
        .nav-tab.active { color: var(--primary); }

        /* Settings Card */
        .settings-card { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-top: 20px; }

        @media (max-width: 480px) {
            .video-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div id="status-badge" style="font-size: 10px; color: var(--primary); border: 1px solid var(--primary); padding: 2px 8px; border-radius: 20px;">ONLINE</div>
    </nav>

    <div class="container">
        
        <!-- HOME SECTION -->
        <div id="home-page" class="page-section active">
            <h2 style="text-align:center; margin-top:50px;">Welcome to Mynul MG</h2>
            <p style="text-align:center; color:var(--text-muted);">আপনার ভিডিও হোস্টিং এবং ম্যানেজমেন্ট পোর্টাল।</p>
            <div class="archive-controls" style="margin-top:30px; text-align:center;">
                <p>আপনি এ পর্যন্ত <b id="stat-count" style="color:var(--primary)">0</b> টি ফাইল আপলোড করেছেন।</p>
                <button class="btn-upload-big" onclick="changeTab('uploads-page', document.getElementById('tab-uploads'))">ফাইল দেখতে এখানে ক্লিক করুন</button>
            </div>
        </div>

        <!-- UPLOADS SECTION -->
        <div id="uploads-page" class="page-section">
            <div class="archive-controls">
                <button class="btn-upload-big" id="custom-upload-btn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Video
                </button>

                <!-- Progress Bar -->
                <div id="progress-container">
                    <div id="progress-bar"><span id="progress-text">0%</span></div>
                </div>

                <div class="search-row" style="margin-top:20px;">
                    <div class="search-box">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="archiveSearch" placeholder="ভিডিও খুঁজুন..." oninput="filterVideos()">
                    </div>
                    <select class="sort-select" id="archiveSort" onchange="sortVideos()">
                        <option value="new">Newest</option>
                        <option value="old">Oldest</option>
                    </select>
                </div>
            </div>

            <div class="video-grid" id="mainGrid">
                <!-- ভিডিও কার্ডগুলো এখানে আসবে -->
            </div>
        </div>

        <!-- SETTINGS SECTION -->
        <div id="settings-page" class="page-section">
            <h3>Settings</h3>
            <div class="settings-card">
                <p style="margin:0;">একাউন্ট স্ট্যাটাস: <b>Free Unlimited</b></p>
                <p style="font-size:12px; color:var(--text-muted);">Storage Location: Uploadcare Cloud</p>
                <hr style="opacity:0.1; margin:15px 0;">
                <button class="btn-sm bg-gray" style="width:100%; padding:12px;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Bottom Mobile Navigation -->
    <div class="bottom-nav">
        <button class="nav-tab active" id="tab-home" onclick="changeTab('home-page', this)">
            <i class="fa-solid fa-house"></i>Home
        </button>
        <button class="nav-tab" id="tab-uploads" onclick="changeTab('uploads-page', this)">
            <i class="fa-solid fa-folder-open"></i>Uploads
        </button>
        <button class="nav-tab" id="tab-settings" onclick="changeTab('settings-page', this)">
            <i class="fa-solid fa-gear"></i>Settings
        </button>
    </div>

    <!-- Uploadcare Hidden Input -->
    <input type="hidden" id="uploader-widget">

    <script>
        let videos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
        const widget = uploadcare.Widget('#uploader-widget');
        const grid = document.getElementById('mainGrid');

        // ১. কাস্টম আপলোড বাটন ক্লিক হ্যান্ডলার
        document.getElementById('custom-upload-btn').addEventListener('click', () => {
            const dialog = uploadcare.openDialog(null, {
                publicKey: '47591ac5fd5756296d19',
                tabs: 'file'
            });

            // আপলোড প্রগ্রেস ট্র্যাকিং
            dialog.done(function(file) {
                document.getElementById('progress-container').style.display = 'block';
                file.progress(function(uploadInfo) {
                    let percent = Math.round(uploadInfo.progress * 100);
                    document.getElementById('progress-bar').style.width = percent + '%';
                    document.getElementById('progress-text').innerText = percent + '% আপলোড হচ্ছে...';
                });

                file.done(function(info) {
                    const newVideo = {
                        id: info.uuid,
                        name: info.name,
                        url: info.cdnUrl,
                        date: new Date().getTime()
                    };
                    videos.unshift(newVideo);
                    localStorage.setItem('mynul_videos', JSON.stringify(videos));
                    
                    // রিসেট UI
                    document.getElementById('progress-container').style.display = 'none';
                    document.getElementById('progress-bar').style.width = '0%';
                    renderGrid(videos);
                    updateStats();
                });
            });
        });

        // ২. ভিডিও গ্রিড রেন্ডার করা
        function renderGrid(data) {
            grid.innerHTML = '';
            if(data.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted);">কোনো ভিডিও পাওয়া যায়নি।</div>`;
                return;
            }
            data.forEach((vid, index) => {
                const date = new Date(vid.date).toLocaleDateString('bn-BD');
                grid.innerHTML += `
                    <div class="video-card">
                        <div class="thumb"><i class="fa-solid fa-play"></i></div>
                        <div class="card-info">
                            <div class="v-name">${vid.name}</div>
                            <div class="v-date">${date}</div>
                        </div>
                        <div class="card-actions">
                            <a href="${vid.url}" target="_blank" class="btn-sm bg-blue" title="Play"><i class="fa-solid fa-play"></i></a>
                            <button class="btn-sm bg-gray" onclick="copyLink('${vid.url}')" title="Copy"><i class="fa-solid fa-link"></i></button>
                            <button class="btn-sm bg-red" onclick="deleteVideo('${vid.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // ৩. ডিলিট ফাংশন (New Feature)
        function deleteVideo(id) {
            if(confirm('আপনি কি নিশ্চিত যে এই ভিডিওটি ডিলিট করবেন?')) {
                videos = videos.filter(v => v.id !== id);
                localStorage.setItem('mynul_videos', JSON.stringify(videos));
                renderGrid(videos);
                updateStats();
            }
        }

        // ৪. ট্যাব পরিবর্তন ফাংশন
        function changeTab(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        // ৫. সার্চ ও সর্ট ফাংশন
        function filterVideos() {
            const term = document.getElementById('archiveSearch').value.toLowerCase();
            const filtered = videos.filter(v => v.name.toLowerCase().includes(term));
            renderGrid(filtered);
        }

        function sortVideos() {
            const mode = document.getElementById('archiveSort').value;
            if(mode === 'new') videos.sort((a,b) => b.date - a.date);
            else videos.sort((a,b) => a.date - b.date);
            renderGrid(videos);
        }

        // ৬. কপি ফাংশন
        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => alert('লিঙ্ক কপি হয়েছে!'));
        }

        function updateStats() {
            document.getElementById('stat-count').innerText = videos.length;
        }

        window.onload = () => {
            renderGrid(videos);
            updateStats();
        };
    </script>
</body>
</html>
