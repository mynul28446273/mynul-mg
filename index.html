<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mynul.mg - Free Video Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 50px; }
        .navbar { background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .upload-box { background: var(--card); padding: 30px; border-radius: 25px; text-align: center; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.1); }
        .uploadcare--widget__button_type_open { background: var(--primary) !important; border-radius: 12px !important; padding: 12px 25px !important; color: #000 !important; font-weight: 700 !important; width: 100%; max-width: 250px; }
        .video-item { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); }
        .video-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .video-info i { font-size: 24px; color: var(--primary); flex-shrink: 0; }
        .video-title { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .btn-group { display: flex; gap: 8px; }
        .btn-action { padding: 8px 12px; border-radius: 10px; text-decoration: none; font-size: 11px; font-weight: 700; border: none; cursor: pointer; color: #fff; }
        .btn-dl { background: #22c55e; }
        .btn-copy { background: #6366f1; }
    </style>
</head>
<body>
    <nav class="navbar"><a href="#" class="logo">mynul.mg</a><div style="font-size: 13px; color: #94a3b8;"><i class="fa-solid fa-circle-user"></i> Admin</div></nav>
    <div class="container">
        <div class="upload-box">
            <h1>ভিডিও আপলোড করুন</h1>
            <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">গ্যালারি থেকে ভিডিও শেয়ার করুন সারাজীবনের জন্য।</p>
            <input type="hidden" role="uploadcare-uploader" data-public-key="47591ac5fd5756296d19" data-tabs="file" id="uploader">
        </div>
        <h3 style="margin-left: 5px;"><i class="fa-solid fa-clapperboard"></i> আপনার ভিডিওসমূহ</h3>
        <div id="videoList"></div>
    </div>
    <script>
        const widget = uploadcare.Widget('#uploader');
        const videoListContainer = document.getElementById('videoList');

        widget.onUploadComplete(function(info) {
            // সঠিক লিঙ্ক তৈরি (info.cdnUrl ব্যবহার করে)
            const videoData = {
                name: info.name,
                url: info.cdnUrl,
                date: new Date().toLocaleDateString()
            };
            saveVideo(videoData);
            displayVideos();
        });

        function saveVideo(video) {
            let videos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
            videos.unshift(video);
            localStorage.setItem('mynul_videos', JSON.stringify(videos));
        }

        function displayVideos() {
            let videos = JSON.parse(localStorage.getItem('mynul_videos')) || [];
            videoListContainer.innerHTML = '';
            if(videos.length === 0) {
                videoListContainer.innerHTML = '<p style="text-align:center; color:#64748b; font-size:13px;">কোনো ভিডিও পাওয়া যায়নি।</p>';
                return;
            }
            videos.forEach((vid, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.innerHTML = `
                    <div class="video-info">
                        <i class="fa-solid fa-file-video"></i>
                        <div><div class="video-title">${vid.name}</div><div style="font-size:10px; color:#64748b;">${vid.date}</div></div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-action btn-copy" onclick="copyLink('${vid.url}')">Copy</button>
                        <a href="${vid.url}" target="_blank" class="btn-action btn-dl">Play</a>
                    </div>`;
                videoListContainer.appendChild(item);
            });
        }

        function copyLink(url) {
            const tempInput = document.createElement('input');
            tempInput.value = url;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert('লিঙ্ক কপি হয়েছে! এবার শর্টনারে ব্যবহার করুন।');
        }

        window.onload = displayVideos;
    </script>
</body>
</html>
