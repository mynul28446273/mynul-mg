<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mynul.mg - Real Cloud & Live Tracker</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Hind+Siliguri:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase & Uploadcare SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <style>
        :root {
            --primary: #38bdf8;
            --bg: #020617;
            --card: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --muted: #94a3b8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- Navbar --- */
        .navbar {
            background: var(--card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky; top: 0; z-index: 2000;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; }
        
        /* Real Online Counter */
        .online-box {
            background: rgba(34, 197, 94, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(34, 197, 94, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pulse-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; position: relative; }
        .pulse-dot::after { content: ''; width: 100%; height: 100%; background: var(--success); border-radius: 50%; position: absolute; left: 0; animation: pLive 1.5s infinite; }
        @keyframes pLive { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        #online-count { font-size: 13px; font-weight: 800; color: var(--success); }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }

        /* --- Page Management --- */
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        /* --- Premium Cards --- */
        .card { background: var(--card); padding: 25px; border-radius: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        
        /* Storage Meter */
        .storage-bar { width: 100%; background: rgba(0,0,0,0.3); height: 14px; border-radius: 10px; margin: 15px 0; overflow: hidden; border: 1px solid rgba(56, 189, 248, 0.2); }
        .fill-unlimited { height: 100%; width: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e, #38bdf8); background-size: 200% 100%; animation: barMove 3s linear infinite; }
        @keyframes barMove { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        /* Buttons */
        .btn { width: 100%; border: none; padding: 16px; border-radius: 15px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.2s; color: #fff; }
        .btn-upload { background: var(--primary); color: #000; margin-bottom: 12px; }
        .btn-save { background: var(--success); }

        /* Progress Area */
        #prog-box { display: none; margin-bottom: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid var(--primary); }
        .p-bar-bg { width: 100%; background: rgba(0,0,0,0.3); height: 10px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .p-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .v-card { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { padding: 10px; font-size: 11px; font-weight: 600; height: 48px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .v-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; }
        .act-btn { border: none; padding: 8px; border-radius: 8px; cursor: pointer; color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .bg-blue { background: var(--primary); color: #000; }
        .bg-indigo { background: #6366f1; }
        .bg-red { background: var(--danger); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 3000; }
        .nav-item { background: none; border: none; color: var(--muted); font-size: 10px; cursor: pointer; text-align: center; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        .uploadcare--widget { display: none !important; }
        @media (max-width: 480px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">mynul.mg</a>
        <div class="online-box">
            <span class="pulse-dot"></span> Online: <span id="online-count">1</span>
        </div>
    </nav>

    <div class="container">
        
        <!-- PAGE 1: HOME -->
        <div id="sec-home" class="page-section active">
            <div class="card">
                <i class="fa-solid fa-infinity" style="font-size: 50px; color: var(--primary); margin-bottom: 15px;"></i>
                <h2 style="margin: 0; letter-spacing: 1px; font-size: 18px;">UNLIMITED SECURE STORAGE</h2>
                <div class="storage-bar"><div class="fill-unlimited"></div></div>
                <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--muted);">
                    <span>Used: <b id="used-txt" style="color:#fff;">0 MB</b></span>
                    <span>Status: <b style="color:var(--success);">CONNECTED</b></span>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
                    <div><b id="file-count" style="font-size: 20px; color: var(--primary);">0</b><br><small>Total Files</small></div>
                    <div><b style="font-size: 20px; color: var(--success);">$0.00</b><br><small>Balance</small></div>
                </div>
            </div>
        </div>

        <!-- PAGE 2: FILES -->
        <div id="sec-files" class="page-section">
            <div class="card" style="padding: 15px;">
                <button class="btn btn-upload" onclick="openGallery()"><i class="fa-solid fa-images"></i> গ্যালারি থেকে আপলোড</button>
                <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 18px; border: 1px solid #334155;">
                    <input type="text" id="urlInput" placeholder="ভিডিওর সরাসরি লিঙ্ক দিন..." style="width:100%; background:transparent; border:none; color:#fff; text-align:center; outline:none; font-size: 14px;">
                    <button class="btn btn-save" style="margin-top:10px; height: 45px;" onclick="saveUrl()"><i class="fa-solid fa-link"></i> লিঙ্ক থেকে সেভ করুন</button>
                </div>
            </div>

            <div id="prog-box">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;">
                    <span id="prog-text">0% Processing...</span>
                </div>
                <div class="p-bar-bg"><div id="p-bar-fill" class="p-bar-fill"></div></div>
            </div>

            <div style="background:var(--card); padding:12px; border-radius:15px; border:1px solid rgba(255,255,255,0.1); margin-bottom:20px; display:flex; align-items:center;">
                <i class="fa-solid fa-magnifying-glass" style="color:var(--muted); margin-right:10px;"></i>
                <input type="text" id="searchInp" placeholder="Search saved videos..." oninput="drawUI()" style="background:transparent; border:none; color:#fff; width:100%; outline:none; font-size:14px;">
            </div>

            <div class="grid" id="videoGrid"></div>
        </div>

        <!-- PAGE 3: SETTINGS -->
        <div id="sec-settings" class="section page-section">
            <div class="card" style="text-align: left;">
                <h3 style="margin: 0; color: var(--primary);">System Dashboard</h3>
                <p style="font-size: 13px; margin: 15px 0;">Enterprise Storage: <b style="color:var(--success);">Connected</b></p>
                <hr style="opacity: 0.1; margin: 20px 0;">
                <button class="btn" style="background: var(--danger); font-size: 13px;" onclick="clearDB()">Reset History (লিস্ট মুছুন)</button>
                <button class="btn" style="background: #334155; margin-top: 10px; font-size: 13px;" onclick="location.reload()">Refresh App</button>
            </div>
        </div>

    </div>

    <!-- Tab Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" id="nav-home" onclick="nav('sec-home', 'nav-home')"><i class="fa-solid fa-house"></i>Home</button>
        <button class="nav-item" id="nav-files" onclick="nav('sec-files', 'nav-files')"><i class="fa-solid fa-folder-open"></i>Files</button>
        <button class="nav-item" id="nav-settings" onclick="nav('sec-settings', 'nav-settings')"><i class="fa-solid fa-gear"></i>Settings</button>
    </div>

    <script>
        // --- সুপাবেস এবং আপলোড কেয়ার ডেটা ---
        const SUPABASE_URL = 'https://zsluamkcuzcpnxgmhabx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_C5D72tFy_0CznaxVbg7xXQ_lcC2Us3i';
        const UC_KEY = '47591ac5fd5756296d19';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let videoData = [];

        // ১. ১০০% কাজ করা নেভিগেশন (আইডি দিয়ে ফিক্সড)
        function nav(secId, navId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            document.getElementById(navId).classList.add('active');
            window.scrollTo(0,0);
        }

        // ২. রিয়েল টাইম ইউজার কাউন্টার (Supabase Presence)
        const channel = client.channel('realtime_presence', { config: { presence: { key: 'user' } } });
        channel.on('presence', { event: 'sync' }, () => {
            const state = channel.presenceState();
            document.getElementById('online-count').innerText = Object.keys(state).length;
        }).subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await channel.track({ online_at: new Date().toISOString() });
        });

        // ৩. আপলোড ফাংশন
        function openGallery() { uploadcare.openDialog(null, { publicKey: UC_KEY, tabs: 'file' }).done(file => track(file)); }
        function saveUrl() {
            const url = document.getElementById('urlInput').value.trim();
            if(!url.startsWith('http')) return alert('সঠিক ভিডিও লিঙ্ক দিন!');
            track(uploadcare.fileFrom('url', url, { publicKey: UC_KEY }));
            document.getElementById('urlInput').value = '';
        }

        function track(file) {
            const box = document.getElementById('prog-box');
            const bar = document.getElementById('p-bar-fill');
            const txt = document.getElementById('prog-text');
            box.style.display = 'block';
            file.progress(i => {
                let p = Math.round(i.progress * 100);
                bar.style.width = p + '%';
                txt.innerText = p + '% Processing...';
            });
            file.done(info => {
                saveToDB(info);
                box.style.display = 'none';
            });
        }

        async function saveToDB(info) {
            // লিঙ্ক তৈরির স্থায়ী নিয়ম (ucarecdn.com/UUID/ ফরম্যাট)
            const videoUrl = `https://ucarecdn.com/${info.uuid}/`;
            const thumbUrl = `https://ucarecdn.com/${info.uuid}/-/preview/640x360/`;

            const { error } = await client.from('videos').insert([{
                file_id: info.uuid,
                file_name: info.name || "Cloud Video",
                file_url: videoUrl,
                file_size: info.size,
                thumbnail_url: thumbUrl
            }]);
            
            if (error) alert("Error: " + error.message);
            else fetchVids();
        }

        async function fetchVids() {
            const { data, error } = await client.from('videos').select('*').order('created_at', { ascending: false });
            if (!error) { videoData = data; drawUI(); }
        }

        function drawUI() {
            const grid = document.getElementById('videoGrid');
            const search = document.getElementById('searchInp').value.toLowerCase();
            let total = 0;
            grid.innerHTML = '';

            videoData.filter(v => v.file_name.toLowerCase().includes(search)).forEach(v => {
                total += (v.size || 0);
                // লিঙ্ক মেরামত এবং স্থায়ীত্ব নিশ্চিত করা
                let link = `https://ucarecdn.com/${v.file_id}/`;
                
                grid.innerHTML += `
                    <div class="v-card">
                        <div class="v-thumb"><img src="${v.thumbnail_url}" onerror="this.src='https://placehold.co/640x360/020617/38bdf8?text=Video'"></div>
                        <div class="v-title">${v.file_name}</div>
                        <div class="v-actions">
                            <a href="${link}" target="_blank" class="act-btn bg-blue"><i class="fa-solid fa-play"></i></a>
                            <button class="act-btn bg-indigo" onclick="copyL('${link}')"><i class="fa-solid fa-link"></i></button>
                            <button class="act-btn bg-red" onclick="delV('${v.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
            });
            document.getElementById('used-txt').innerText = (total / (1024 * 1024)).toFixed(2) + " MB";
            document.getElementById('file-count').innerText = videoData.length;
            if(videoData.length === 0) grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--muted);">No files found.</div>';
        }

        function copyL(url) {
            const el = document.createElement('textarea'); el.value = url; document.body.appendChild(el);
            el.select(); document.execCommand('copy'); document.body.removeChild(el);
            alert('লিঙ্ক কপি হয়েছে!');
        }

        async function delV(id) {
            if(confirm('বস্, লিস্ট থেকে সরাতে চান?')) {
                const { error } = await client.from('videos').delete().eq('id', id);
                if (!error) fetchVids();
            }
        }
        function clearDB() { if(confirm('লিস্ট মুছে যাবে!')) { localStorage.clear(); location.reload(); } }

        window.onload = fetchVids;
    </script>
</body>
</html>
